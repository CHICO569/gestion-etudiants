services:
  postgres:
    image: postgres:17
    container_name: postgres_gestion_etudiants
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_etudiants
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d gestion_etudiants"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: